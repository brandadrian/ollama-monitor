# Lokales Prometheus + Loki + Grafana für OllamaMonitor
# Start:  docker compose up -d
# Grafana: http://<host>:3000  (admin / admin, beim ersten Login ändern)
#
# Daten liegen in ./data/ neben dieser Datei (einfach zu sichern, z.B. mit Hyper Backup).

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: ollama-prometheus
    restart: unless-stopped
    user: "0:0"   # vermeidet Rechteprobleme mit Bind-Mounts (z.B. auf Synology)
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=365d     # 1 Jahr aufbewahren
      - --storage.tsdb.retention.size=10GB     # oder max. 10 GB, was zuerst eintritt
      - --web.enable-otlp-receiver             # OTLP-Endpunkt: /api/v1/otlp/v1/metrics
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./data/prometheus:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: ollama-loki
    restart: unless-stopped
    user: "0:0"
    command:
      - -config.file=/etc/loki/loki-config.yaml
    ports:
      - "3100:3100"   # Push-API: /loki/api/v1/push
    volumes:
      - ./loki/loki-config.yaml:/etc/loki/loki-config.yaml:ro
      - ./data/loki:/loki

  grafana:
    image: grafana/grafana:latest
    container_name: ollama-grafana
    restart: unless-stopped
    user: "0:0"
    depends_on: [prometheus, loki]
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/ollama.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - ./data/grafana:/var/lib/grafana
